schema_version: "0.1-draft"
status: "blocked_until_stage2_stage3_inputs"
execution_mode: "zero_shot_frozen_openclip"

inputs_to_freeze:
  dataset_manifest: null
  split_manifest: null
  baseline_image_pipeline_I0: null
  baseline_text_pipeline_T0: null
  baseline_model_config: null
  model_weight_sha256: null
  minimum_practical_difference_delta: null

constants_across_groups:
  same_sample_ids: true
  same_splits: true
  same_model_and_weight_hash: true
  same_precision: true
  same_batch_settings: true
  same_candidate_library: true
  zero_shot_training_steps: 0
  deterministic_repeat_runs: 2

groups:
  A:
    image_pipeline: I0
    text_pipeline: T0
    purpose: baseline
  B:
    image_pipeline: I1
    text_pipeline: T0
    purpose: image_normalization_effect
  C:
    image_pipeline: I0
    text_pipeline: T1
    purpose: text_normalization_effect
  D:
    image_pipeline: I1
    text_pipeline: T1
    purpose: joint_effect_and_interaction

image_pipeline_I1_candidate:
  numeric_source:
    coefficient: "inherit_and_freeze_from_stage2"
    invalid_before_log: true
    db_conversion: "10*log10(max(valid_linear_value, eps))"
    clipping:
      fit_on: train_only
      method: global_per_channel_quantile
      candidate_quantiles: [0.01, 0.99]
    scale: [0.0, 1.0]
    dual_pol_channels: [VV_db, VH_db, VV_db_minus_VH_db]
    single_pol_policy: stratify_or_explicit_replicate
    propagate_valid_mask: true
  rendered_source:
    deterministic_decode: true
    per_image_auto_contrast: false
    claim_physical_calibration: false

text_pipeline_T1_candidate:
  vocabulary_version: null
  template_version: null
  fields:
    - primary_feature
    - secondary_features
    - coverage
    - spatial_relations
    - uncertainty
    - evidence
  allow_unsupported_claims: false
  preserve_uncertainty: true

primary_metrics:
  - text_to_image_R@1
  - text_to_image_R@5
  - text_to_image_R@10
  - image_to_text_R@1
  - image_to_text_R@5
  - image_to_text_R@10
  - bidirectional_mean_recall

statistics:
  unit: query_id
  paired_bootstrap_repetitions: 10000
  confidence_level: 0.95
  report_exact_rerun_difference: true
  effects:
    image: "((B-A)+(D-C))/2"
    text: "((C-A)+(D-B))/2"
    interaction: "D-C-B+A"

robustness_suites:
  synonym_paraphrase:
    train_on_perturbations: false
    paraphrases_per_query: [2, 3]
    metrics: [recall_gap, median_rank_shift, topk_jaccard, embedding_cosine]
  negation_minimal_pair:
    train_on_perturbations: false
    require_human_verification: true
    metrics: [pairwise_accuracy, positive_negative_margin, negative_topk_rate]
  factual_support:
    labels: [supported, contradicted, unknown]
    keep_unknown_separate: true
    metrics: [pairwise_accuracy, auc, spearman_diagnostic]

quality_gates:
  - baseline_A_reproduced
  - identical_sample_ids_and_splits
  - train_only_fit_for_all_normalization_parameters
  - no_nan_or_inf_in_model_inputs
  - every_normalized_atomic_fact_has_evidence
  - no_test_guided_rule_changes
  - complete_hash_and_environment_records

optional_finetuning_extension:
  enabled: false
  seeds: [17, 37, 67]
  require_same_initialization_policy: true
  require_same_optimizer_schedule: true
  require_same_effective_batch_size: true
  require_same_training_steps: true
  report_separately_from_zero_shot: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-text-retrieval-baseline"
version = "0.1.0"
description = "Reproducible bidirectional SAR image-text retrieval baseline"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "torch==2.4.1",
  "open_clip_torch==3.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
